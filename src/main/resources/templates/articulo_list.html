<!-- articulo_list.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Artículos</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Para los iconos -->
</head>
<body>
    <header>
        <nav>
            <h1>Gestión de Artículos</h1>
        </nav>
    </header>
    <main>
        <h2>Lista de Artículos</h2>
        <table class="lista-articulos-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Fábrica</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="articulo : ${articulos}">
                    <td th:text="${articulo.idArticulo}"></td>
                    <td th:text="${articulo.nombreArticulo}"></td>
                    <td th:text="${articulo.descripcionArticulo}"></td>
                    <td th:text="${articulo.fabrica.nombreFabrica}"></td>
                    <td>
                        <a th:href="@{/articulo/modificar/__${articulo.idArticulo}__}" class="btn btn-edit">Modificar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <footer>
        <p>&copy; 2025 Gestión de Artículos</p>
    </footer>
</body>
</html>
